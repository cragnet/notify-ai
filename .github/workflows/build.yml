name: Build APK

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.x"
          channel: "stable"

      - name: Get dependencies
        run: flutter pub get

      - name: Generate commit hash
        run: bash generate_commit.sh

      - name: Auto-increment build number
        run: |
          CURRENT=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          NEXT=$((CURRENT + 1))
          sed -i "s/\(^version: .*+\)$CURRENT/\1$NEXT/" pubspec.yaml
          echo "Bumped build number: $CURRENT -> $NEXT"
          cat pubspec.yaml | grep '^version:'

      - name: Build APK
        run: flutter build apk --release
        env:
          GRADLE_OPTS: -Xmx4g

      - name: List APK files
        run: |
          echo "=== Looking for APK files ==="
          find build -name "*.apk" -type f 2>/dev/null | head -20
          ls -la build/app/outputs/flutter-apk/ 2>/dev/null || echo "flutter-apk dir not found"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notify-ai-release
          path: build/app/outputs/flutter-apk/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/app-release.apk
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
