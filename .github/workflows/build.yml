name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    
    env:
      GRADLE_OPTS: -Xmx3g -XX:MaxMetaspaceSize=512m -XX:+HeapDumpOnOutOfMemoryError -XX:ParallelGCThreads=2
      _JAVA_OPTIONS: -Xmx3g -XX:MaxMetaspaceSize=512m

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      - name: Free up space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo apt-get clean
          df -h

      - name: Build Release APK
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon --max-workers=1 --offline 2>&1 | head -500
        env:
          GRADLE_OPTS: -Xmx3g -XX:MaxMetaspaceSize=512m -XX:ParallelGCThreads=2

      - name: Find APK
        run: find build -name "*.apk" -type f

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: notify-ai-release
          path: build/**/*.apk
          retention-days: 30