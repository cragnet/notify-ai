name: notify_ai
description: AI-powered notification summariser supporting multiple AI providers
publish_to: 'none'
version: 2.0.6+9

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  provider: ^6.1.2
  shared_preferences: ^2.2.2
  flutter_secure_storage: ^9.0.0
  http: ^1.2.0
  permission_handler: ^11.3.0
  share_plus: ^10.0.0
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  fl_chart: ^0.68.0
  intl: ^0.19.0
  collection: ^1.18.0
  package_info_plus: ^8.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/commit.txt
